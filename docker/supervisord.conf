[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1024x768x24
autostart=true
autorestart=true

[program:lxsession]
command=/usr/bin/lxsession -s LXDE -e LXDE
environment=DISPLAY=:1
autostart=true
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -rfbport 5900
autostart=true
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc localhost:5900 --listen 6080
autostart=true
autorestart=true

[program:rosbridge]
command=/bin/bash -lc "source /opt/ros/humble/setup.bash && exec ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090"
autostart=true
autorestart=true
startsecs=5
