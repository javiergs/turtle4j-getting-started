name: Generate TURTLE4J 1.0.0 Javadoc
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Full 40-character api-turtle4j commit SHA used for the Maven Central 1.0.0 release'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  release-javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable release source reference
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Supply the full 40-character release commit SHA, not a branch name."
            exit 1
          fi
          if [[ -e docs/javadoc/1.0.0/index.html ]]; then
            echo "::error::1.0.0 documentation already exists; frozen releases must not be overwritten."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: jgs-lab/api-turtle4j
          ref: ${{ inputs.release_commit }}
          token: ${{ secrets.TURTLE4J_SOURCE_TOKEN }}
          persist-credentials: false
          path: _turtle4j-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: _turtle4j-source/pom.xml
      - name: Generate frozen release Javadoc
        shell: bash
        run: |
          set -euo pipefail
          cd _turtle4j-source
          test -f src/main/java/com/javiergs/turtle4j/TurtleClient.java
          grep -Eq '<version>1\.0\.0</version>' pom.xml || { echo "::error::Release source POM does not declare 1.0.0"; exit 1; }
          rm -rf src/main/java/com/javiergs/turtle4j/examples
          mvn -B -ntp -DskipTests \
            -Dbottom='Copyright &#169; 2026 Javier Gonzalez-Sanchez' \
            javadoc:javadoc
          DOC_INDEX="$(find target -type f -path '*/apidocs/index.html' -print -quit)"
          test -n "$DOC_INDEX" || { echo "::error::Generated Javadoc index missing"; exit 1; }
          DOC_DIR="$(dirname "$DOC_INDEX")"
          cd ..
          mkdir -p docs/javadoc/1.0.0
          rsync -a "_turtle4j-source/$DOC_DIR/" docs/javadoc/1.0.0/
          rm -rf _turtle4j-source
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: add frozen TURTLE4J 1.0.0 Javadoc'
          branch: automation/frozen-javadoc-1.0.0
          delete-branch: true
          title: 'docs: add frozen TURTLE4J 1.0.0 Javadoc'
          body: |
            Generate versioned documentation from the explicitly supplied release commit.
            Verify that this commit matches the published 1.0.0 artifact before merging.
            Once merged, treat this directory as immutable.
          add-paths: docs/javadoc/1.0.0
